# Semantic tag vocabulary. Referenced from topics.yaml as  facet/id  (e.g.  tension/hype-vs-evidence).
# Design rules (see docs/TAG-GUIDE.md):
#   * every tag must be able to connect >= 2 themes (cross-cutting, not a re-labelled theme)
#   * target 3-12 topics per tag (rarer = no network effect; commoner = hairball)
#   * a tag is a *reason two notes belong together*; say what that reason is in 'def'
# 'poles' (tensions only) are the two ends of the debate.

tension:
  copy-vs-principles:
    label: "Copy nature's parts ↔ extract its rules"
    poles: ["Copy nature's parts", "Extract nature's rules"]
    def: "Whether to reproduce biological structures or abstract the principles behind them, and whether those principles are portable, and precise enough to design with."
  control-vs-emergence:
    label: "Imposed control ↔ self-assembly & emergence"
    poles: ["Imposed control", "Self-assembly & emergence"]
    def: "How much to specify with machines (printing, patterning) versus letting living or soft matter organise itself, and what we are optimising for."
  robust-vs-adaptable:
    label: "Robust & uniform ↔ adaptive & variable"
    poles: ["Robust & uniform", "Adaptive & variable"]
    def: "Designing for reliable, uniform outcomes versus tolerating or exploiting variability: in tissues, feedstocks, bioprocesses and materials in service."
  hype-vs-evidence:
    label: "Breakthrough hype ↔ premature dismissal"
    poles: ["Breakthrough hype", "Premature dismissal"]
    def: "Telling genuine progress from hype (and from reflexive dismissal) when evidence is incomplete: in claims, benchmarks, ventures and long-term data."
  replace-vs-reinvent:
    label: "Drop-in replacement ↔ new capability"
    poles: ["Drop-in replacement", "New capability"]
    def: "Whether biobased materials should match incumbents on the incumbents' terms, or win by offering functions incumbents cannot (sensing, repair, adaptation, locality)."
  niche-vs-bulk:
    label: "High-value niche ↔ bulk volume"
    poles: ["High-value niche", "Bulk volume"]
    def: "Micro-scale, high-value uses versus commodity-scale production, and how energy, cost and infrastructure tip the balance."
  invent-vs-implement:
    label: "More new solutions ↔ implementing what we have"
    poles: ["More new solutions", "Implementing what we have"]
    def: "Whether progress is limited by missing technology or by our willingness and ability to deploy existing options, including whether new materials complicate reuse."
  natural-vs-good:
    label: "Biological origin ↔ demonstrated benefit"
    poles: ["Biological origin", "Demonstrated benefit"]
    def: "'Bio' describes origin or process, not performance: it does not by itself imply safety, biodegradability, sustainability or ethical value."
  private-vs-common:
    label: "Private ownership ↔ common good"
    poles: ["Private ownership & markets", "Common good & access"]
    def: "Who owns, funds and benefits: IP, markets, commons, public data, shared facilities, consumer protection."
  access-vs-safety:
    label: "Open access ↔ safety & misuse"
    poles: ["Open access", "Safety & misuse"]
    def: "Widening access to tools and devices (convivial, at-home, consumer) versus managing risk, misuse, accountability and regulation."
  human-vs-organism:
    label: "Human benefit ↔ duties to other life"
    poles: ["Human benefit", "Duties to other life"]
    def: "What we owe the organisms and ecosystems we use, engineer or affect: not just through them, but to them."
  general-vs-specific:
    label: "General & portable ↔ specific & contextual"
    poles: ["General & portable", "Specific & contextual"]
    def: "Abstraction and standardisation versus context-specific precision: in principles, signals, standards, models and platforms."
  living-vs-inert:
    label: "Living & maintained ↔ inert & finished"
    poles: ["Living & maintained", "Inert & finished"]
    def: "Materials that stay alive and need care versus ones that were alive, or are fabricated and finished; and what that means for definition, durability and end of life."
  platform-vs-bespoke:
    label: "Derisk once & reuse ↔ approve case by case"
    poles: ["Derisk once & reuse", "Approve case by case"]
    def: "Whether a validated platform can be reused across products or indications, or each application needs its own evidence and approval."
  near-vs-far:
    label: "Near-term utility ↔ long-term & speculative"
    poles: ["Near-term utility", "Long-term & speculative"]
    def: "Market-ready use versus early-stage, blue-sky or speculative research and futures."

concept:
  emergence:
    label: "Emergence"
    def: "Properties that arise from organisation, interaction and signalling rather than composition alone."
  hierarchy:
    label: "Hierarchy & modularity"
    def: "Structure across length scales, modular building blocks, redundancy."
  gradients:
    label: "Gradients"
    def: "Spatial variation in composition, structure or chemistry: diffusion, porosity, pressure, salinity."
  self-assembly:
    label: "Self-assembly & morphogenesis"
    def: "Order that arises spontaneously or through guided growth rather than being imposed."
  patterning:
    label: "Spatial patterning"
    def: "Organising cells, molecules or materials in space (and time)."
  dynamic-function:
    label: "Sensing, repair & adaptation"
    def: "Materials or processes that sense, respond, repair themselves or adapt."
  signalling:
    label: "Signalling & circuits"
    def: "Molecular signals, sensors, circuits and crosstalk, including turning binding events into readable outputs."
  programmability:
    label: "Programmable matter"
    def: "Designing materials or biomolecules like code: encoded, addressable, synthesisable on demand."
  new-to-nature:
    label: "New-to-nature chemistry"
    def: "Building blocks, polymers and functions that biology has not used."
  hydration:
    label: "Water & hydration"
    def: "Aqueous materials, humidity, hydrogels, and what water does to materials."
  variability:
    label: "Variability & reproducibility"
    def: "Batch, feedstock and biological variation; reproducibility and which parameters to standardise."
  degradation:
    label: "Degradation & durability"
    def: "Biodegradation, deterioration, triggers and lifetimes in service."
  circularity:
    label: "Circularity & reuse"
    def: "Waste streams, feedstocks, reuse, repair and recycling loops."
  care-and-maintenance:
    label: "Care & maintenance"
    def: "What it takes to keep things (and organisms) alive or working: nutrients, moisture, upkeep, attention."
  climate-performance:
    label: "Climate performance"
    def: "Carbon, energy and life-cycle claims of materials and processes."
  ecosystems:
    label: "Ecosystems & symbiosis"
    def: "Interactions with, and consequences for, wider living systems."
  true-cost:
    label: "True cost & value capture"
    def: "Hidden costs along a supply chain, and who captures the value or carries the cost."

barrier:
  data-gaps:
    label: "Data gaps & readouts"
    def: "Missing datasets, measurements, long-term data or high-throughput readouts."
  shared-language:
    label: "Definitions & shared language"
    def: "Terms, taxonomies and vocabularies that differ across fields, or that hide different assumptions."
  unit-economics:
    label: "Unit economics"
    def: "Cost, price, margins and product–market fit."
  scale-up:
    label: "Scale-up & infrastructure"
    def: "Moving from lab to volume; facilities, supply chains, collection systems."
  regulation-and-evidence:
    label: "Regulation & long-term evidence"
    def: "Approval pathways, standards, and the long-term evidence regulators and clinicians need."
  adoption-inertia:
    label: "Adoption & inertia"
    def: "Perception, habit, incumbents and the social cost of change."
  funding-and-incentives:
    label: "Funding & incentives"
    def: "Who pays, who invests, and what gets rewarded (including attention)."
  safety-and-misuse:
    label: "Safety, security & misuse"
    def: "Biosafety, dual use, toxicity risk and the limits of rules."

domain:
  cellulose-and-wood:
    label: "Cellulose & wood"
    def: "Wood, bacterial and plant cellulose, polysaccharide materials."
  proteins-and-peptides:
    label: "Proteins & peptides"
    def: "Protein-based materials, designed peptides, adhesives, enzymes."
  dna-and-nucleic-acids:
    label: "DNA & nucleic acids"
    def: "DNA/RNA as material, tool or therapeutic."
  textiles-and-fashion:
    label: "Textiles & fashion"
    def: "Fibres, leathers, garments and the fashion industry's use of 'bio'."
  construction-and-minerals:
    label: "Construction & minerals"
    def: "Concrete, biomineralisation, structural materials, habitats and infrastructure."
  medical-and-clinical:
    label: "Medical & clinical"
    def: "Implants, dressings, scaffolds, therapeutics, organoids and clinical use."
  engineered-cells:
    label: "Engineered cells & hosts"
    def: "Microbial and mammalian hosts, enzymes and artificial cells as production or sensing platforms."
  living-materials:
    label: "Living materials"
    def: "Materials that contain or are alive: engineered living materials, living interfaces, living therapeutics."
  marine-and-ocean:
    label: "Marine & ocean"
    def: "Oceans, seabed, marine organisms and underwater environments."
  waste-and-feedstocks:
    label: "Waste & feedstocks"
    def: "Waste streams and variable inputs to bioprocesses."

method:
  machine-learning:
    label: "Modelling & AI"
    def: "Prediction, simulation, generative and inverse design, and world models (including ecosystem and developmental modelling)."
  biofabrication:
    label: "Printing & biofabrication"
    def: "3D printing, microfluidics, volumetric and guided-assembly fabrication."
  lca-and-economics:
    label: "Life-cycle & techno-economic analysis"
    def: "Life-cycle assessment and techno-economic analysis, and the system boundaries and reference points they depend on."
