- id: dropin-replacement
  title: "Biobased materials ≠ drop-in replacements"
  sessions: [VAN]
  note_ids: []
  scale: [micro, macro]
  wg: []
  texts:
    - { from: docx, find: "same terms" }
  questions:
    - "Where are drop-in replacement strategies useful, and what are they limited by?"
    - "What new functions should define the value of biomaterials?"
    - "How do we build markets, standards and infrastructures for materials that behave differently?"
    - "What would a biobased material look like if it were designed around repair, sensing, locality or circularity rather than replacement? Can we design urban infrastructure for this future?"
  refs: []
  notes: |
    **Where are drop-in strategies useful, and what limits them?**
    - Fitting into previous moulds limits us; sustainability funding may reinforce this by setting goals for specific applications.
    - Biobased materials often need entirely different processing, so they are hard to drop into a complex existing industry.

    **What new functions should define the value of biomaterials?**
    - Accessibility and ease of fabrication are key to wide integration; composites are often the material of choice, so functionalised biomaterials must compete. What looks good in a paper often differs from what works in industry.
    - Reproducibility is a major challenge for advanced functionalised biomaterials: the field must standardise which parameters are shared, and ask how much performance is set by the starting material or supplier — a problem conventional polymers such as polyethylene also have (batch mixing).
    - Do not force a material out of its nature: harness natural properties and look at what already exists. Processes and chemistry can themselves act as functions. Purity is a big problem. High-value biomaterials already exist (wood, for example); using waste is attractive environmentally, with function secondary.

    **Sustainability claims**
    - Claims of sustainability or nature-friendliness are weakened when the functionalisation relies on harsh chemical processes. Sustainability is relative to a reference point, and life-cycle assessment rests on databases whose system boundaries and comparisons keep shifting.
    - Fractionation: after diving deep into microstructure, how do we zoom back out and use that knowledge to enable macroscale applications?

- id: biomimicry-too-literal
  title: "Biomimicry is too literal"
  sessions: [VAN, RM009]
  note_ids: ["RM009.3"]
  scale: [meso, macro]
  wg: [wg1]
  texts:
    - { from: docx, find: "too focused on copying" }
  questions:
    - "What would a shared design language between biology, materials science and infrastructure look like?"
    - "What gets lost when biomimicry becomes visual or metaphorical?"
  refs: []
  notes: |
    **Vancouver session**
    - No consensus on the definition of biomimicry. One view: it requires understanding of *mechanism* rather than structure (a materials-science perspective). Another: not necessarily mechanistic understanding, but taking part in wider ecosystem life cycles over time.
    - Where is the line between mimicry and inspiration? Mimicry is more precise; “bioinspired” is looser, often a buzzword, and the border is fuzzy. Scale is not the issue; definitions vary by field.
    - Are we replicating something, or making something and then finding a similar thing in nature? (Replication example: layer-by-layer, nacre-like fabrication of an organic polymer plus an inorganic mineral. Retrospective-tagging example: a material’s thermal insulation resembling the hollow structure of polar-bear fur.) What matters is the mechanism.
    - What gets lost when biomimicry becomes visual or metaphorical? Bioinspiration may fall short of true biomimicry yet still be positive — and still serve as a marketing tool.
    - One group argued biomimicry is *not literal enough*: true biomimicry has not been achieved, and symbiosis — water, cell and gas cycles — is the more important concept.

    **RM009 follow-up** (brief handwritten notes)
    - Better collaboration between the sciences; scale matters, and changes perspective.
    - More blue-sky research → support for failure → a more directed agenda.
    - Systems biology missed its promise (more sequencing and measurement at different scales); “grey-box” approaches accept that unexpected things happen while still making the unexplained understandable.

- id: manufacturing-vs-self-assembly
  title: "Manufacturing versus self-assembly"
  sessions: [VAN, RM006]
  note_ids: ["RM006.10"]
  scale: [micro, meso]
  wg: []
  texts:
    - { session: VAN, from: docx, find: "When does order become life" }
    - { session: RM006, from: docx, find: "Follow up to multicellular patterning" }
  questions:
    - "What can fabrication control well, and what should be delegated to self-assembly?"
    - "Is precision always desirable, or can biological variability be productive?"
    - "What is the end point of 3D fabrication or morphogenesis?"
  refs: []
  notes: |
    **Vancouver session — what is self-assembly?**
    - There is no good agreed answer. Thermodynamically spontaneous re-ordering? “No human input”? Is genetic engineering of a self-assembly pathway still self-assembly? Not everything is self-assembly; almost everything we make is additive manufacturing.
    - Bottom-up approaches aim to produce less waste, but self-assembly is bottlenecked by the complexity of the starting material.
    - Randomness matters: for many biological materials it is the random distribution of components that gives their properties, whereas mass manufacturing expects uniformity. Cultured meat is among the most complex things we can attempt.
    - When does order become life? Candidate criteria: information (DNA), intelligence, starting to *function* rather than merely having capability, reproducing (alone but within its surroundings), reducing entropy.

    **RM006 session — printing methods and imagined applications**
    - Printing routes of interest: extrusion, droplet (oil-in-water / water-in-oil) printing, liquid-in-liquid printing, two-photon (scattering limits), aspiration-assisted assembly — and **volumetric / xolographic printing**, judged most interesting: if cell and medium densities match, cells distribute homogeneously and could carry genetic logic gates (for example to trigger cell–cell adhesion). Limits: scale (light penetration) and refractive-index matching.
    - Likely outcome: a mixture of self-assembly (emergence) and encoded, ordered structure.
    - Imagined applications: heart organoids built from progenitor cells on a tube-like scaffold (heart contraction is physics-based, so shape and orientation coordinate it); synthetic wood; morphogenesis — the current limits of two- and three-node Turing patterns in silico versus in vivo.
    - Wood: how do we cultivate carbon-sequestering structural materials? Engineering *wood* from day one might mean ready-to-use planks growing vertically with peel-off bark; engineering a *tree* for efficient extraction might mean a pristine cellulose core with a lignin/xylan exterior. How to engineer anisotropy into (mostly isotropic) bacterial cellulose — for example a xylem-like cellulose–lignin mat with algae seeded on top for photosynthesis in a “runway” bioreactor? At least one start-up is exploring cultured wood via xylem differentiation of plant cells.
    - Hot takes: the physics of biomacromolecules is the same across classes; people do not know what they want until it is presented to them; there should be no limits to innovation (fundamental research can look like a gimmick until it is not).

- id: bacterial-cellulose-vs-wood
  title: "Bacterial cellulose ≠ wood"
  sessions: [VAN]
  note_ids: []
  scale: [micro]
  wg: []
  texts:
    - { from: docx, find: "bacterial cellulose as a substitute for wood" }
  questions:
    - "What properties of bacterial cellulose are not “wood-like” and should be treated as advantages?"
    - "How can we overcome the hydration problem in bacterial cellulose? 98–99% of its wet mass is water."
    - "What would a cellulose-based material system look like if it were designed for cities, medicine, electronics or climate adaptation from first principles?"
    - "What forms of growth, patterning, responsiveness, repair, hybridity, porosity, sensing or local fabrication can we introduce to bacterial cellulose? How?"
  refs: []
  notes: |
    **Group discussions**
    - Cellulose is needed generally and high-volume production is possible; purer compounds need more applied uses; until deeper research on complexation for more diverse applications, cellulose can be compared to wood simply as a source of cellulose.
    - Forestry, life-cycle assessment and economics: views differed on how favourable sourcing from wood is compared with alternatives, and old-growth forest is very valuable and increasingly contested. Little will change until businesses are convinced that new solutions make money and are made to account for their waste; research tends to aim at impact rather than at being convenient and convincing for companies.
    - Imagining a tree engineered from day one: no vertical growth? remove hemicellulose? focus on cellulose (simple structure, good mechanical properties)? a renewable source of aromatic carbon, but more linear? Planks with easy-peel bark (just for packaging), no leaves, no processing.
    - What can bacterial cellulose do that wood never could? Ion transport for batteries; underwater bags or nets for divers.

    **Combined session**
    - Bacterial cellulose lacks the complexity of wood (about six levels of hierarchy: molecular, fibril, cell, tissue, rings, tree); wood by-products are not arbitrary.
    - Demand for cellulose has not yet outstripped what agro-industry already provides.
    - A claim that bacterial cellulose synthase uses less ATP than the plant enzyme was questioned: it depends on whether you count the whole pathway to UDP-glucose and UDP→UTP regeneration.

- id: micro-vs-bulk
  title: "Should biomaterials research be limited to the microscale?"
  sessions: [RM006]
  note_ids: ["RM006.11"]
  scale: [macro]
  wg: []
  texts:
    - { from: xlsx, sheet: "006 | 20062026", find: "limited to the microscale" }
  refs: []
  notes: |
    - **Overall stance:** the group mostly pushed back on the micro-scale framing — macroscale biomaterials already dominate (agriculture has shaped living materials since prehistory; wood is the most abundant biomaterial; bulk biomaterials do not have to be genetically modified to count as biotechnology) — but agreed that micro-scale precision is essential for medical applications.
    - **Growing bulk materials in bioreactors:** on *energy economy*, simple monomers are cheap and a fair drop-in while complex materials (for example with integrated sensing) get inefficient quickly; it was suggested that a bioprocess can rival harsh chemical synthesis on energy. On *quality versus speed*, can fast bioreactor cellulose ever match hardwood? Ideas: design directly for hardwood composition and lignin ratios; “overclock” trees by simulating seasons in controlled warehouses.
    - **Where micro-scale wins:** precision patterning is irreplaceable for in-vitro organs, prosthetics, bone grafts (3D-printed scaffolds, hydrogels with stem cells or growth factors), cartilage and collagen composites; cultivated meat also needs scaffolds. Lipid nanoparticles in vaccines can programme release kinetics (for example a delayed booster).
    - **Higher-order programming can also come from physics:** self-organisation and excitable-media dynamics (for example spiral calcium waves in heart cells) give large-scale order from geometry alone — a counterpoint to the premise that advanced genetic manipulation is the route.
    - **Circularity tangent:** modified wood and cross-laminated-timber buildings; a pitch for brick-style deconstructable buildings so that treated wood can be reused rather than landfilled — framed as a policy problem with our linear system.

