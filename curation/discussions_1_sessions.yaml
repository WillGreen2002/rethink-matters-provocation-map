# Discussions = the provocations that were actually aired (RM003 → RM010, incl. the Vancouver edition).
# Provocation TEXT is pulled verbatim from the workbook / notes docx at build time (see 'texts'); it never includes the
# provocateur column. 'notes' are anonymised digests of the post-meeting synthesis notes (Chatham House Rule):
# no names, no attribution, no unverifiable claims about named third parties, nothing about any one person's own pathway.
# scale: from the sheet's Category column (normalised). wg: only where the sheet recorded a working group.

- id: bio-not-good
  title: "“Bio” doesn’t make something “good”"
  sessions: [RM003]
  note_ids: ["RM003.1"]
  scale: [macro]
  wg: []
  texts:
    - { from: docx, find: "caring practices" }
  refs:
    - { label: "On the group’s Bookshelf: ‘Let’s build a shared language’", url: "https://rethinkmatters.org/lets-build-a-shared-language-20-04-2026" }
  notes: |
    **Definitions diverge by field**
    - The medical and the fashion/design uses of “biomaterial” may not refer to the same thing: one is defined by manufacture and origin (biologically sourced or derived), the other by use case (biocompatibility). Being explicit about context and use case was recommended.
    - In design contexts “biomaterial” may sit closer to *bioreceptive* than to *biocompatible*.

    **Different justifications in medicine and design**
    - In medical settings sustainability is a minor consideration: little material is used, human health is the “higher cause”, and end of life is already determined (medical waste is incinerated).
    - Ethical oversight is bounded more straightforwardly in medicine (clear health-and-safety guidance, COSHH-style forms); ethics is especially pronounced for genetically modified materials and organisms, particularly with human cells.
    - From the design side, a new material needs a justification for replacing an existing one: biomaterials invite the reworking of systems and supply chains.

    **Care ethics, rules and misuse**
    - “Care” can be romanticised in biodesign; in laboratory science it is dictated by protocols (e.g. humane end-points for animals).
    - Misuse risk cannot be fully engineered away; it falls to administrative controls and screening (DNA-synthesis providers can flag suspicious orders, but work-arounds exist). Curiosity alone is not a justification for research.
    - Rules (safety protocols) are not the same as ethics (personal judgement). Designers working in scientific labs may be assumed to have safety training they lack; “just because you can dye a textile with it” does not make a toxic dye acceptable.

    **Concluding thoughts**
    - “Bio”, “materials” and “good” are all contested terms; the prompt exposes differences between disciplines.
    - For science, “good” was framed as (money >) human health > environment.
    - A sense that “good” is unattainable at industrial scale: any process, however much better than the alternative, creates knock-on effects and new patterns of resource use (for example, effluent treatment around a large fermentation-based food plant).

- id: aqueous-materials
  title: "Why are most man-made materials “dehydrated”?"
  sessions: [RM003]
  note_ids: ["RM003.2"]
  scale: [micro]
  wg: []
  texts:
    - { from: docx, find: "aqueous phase" }
  refs:
    - { label: "Stuff Matters — Guardian review", url: "https://www.theguardian.com/books/2013/jul/03/stuff-matters-strange-miodownik" }
  notes: |
    **Main takeaway**
    - Humidity in a material is conducive to life, which leads to degradation after fabrication. Above roughly 65% relative humidity, chemical or biological deterioration (hydrolysis, mould) sets in — “biology always wins”. Wetting-and-drying cycles are the particular problem.
    - Agency over biodegradation is low: the group felt we have very little control over the moment a material becomes functional and the moment it stops being so.
    - Man-made materials are mostly dehydrated (“only as strong as the day they are made”) and tolerate little change in humidity (e.g. swelling and shrinking in wood). There is no built-in cycle of life and death that could keep a living material going without changing its constitution.

    **Where aqueous materials might make sense**
    - Places that are already wet, or cycle between wet and dry and would do better staying wet: waterlogged timber piles under Venetian buildings; water-filtration membranes; hydrogels; contact lenses and other medical devices (everything biomedical already sits in water, through us).
    - Architecture looks more realistic than textiles: wet fabric on skin is unpopular and unhygienic, and garments need washing.

    **Wider question**
    - Do we want materials to last? “We want total control over end of life” — but that is not currently possible. To what extent can we make things degrade in specific environments?

- id: convivial-biomaterial
  title: "Can a biomaterial be a convivial technology?"
  sessions: [RM004]
  note_ids: ["RM004.3"]
  scale: [macro]
  wg: []
  texts:
    - { from: docx, find: "Convivial technology" }
  refs:
    - { label: "Tools for Conviviality (Illich, 1973)", url: "https://en.wikipedia.org/wiki/Tools_for_Conviviality" }
    - { label: "Article cited in the provocation", url: "https://www.tandfonline.com/doi/abs/10.1080/23299460.2024.2351233" }
  notes: |
    **What “convivial” means here** — after Ivan Illich (*Tools for Conviviality*, 1973): tools that let people exercise autonomy and creativity, in contrast to industrial tools that become destructive to autonomy and ingenuity. Examples given: bicycles, kombucha, open-source software (convivial) versus smartphones, cars and closed software (opacity, dependency, isolation, environmental damage). The *Matrix of Convivial Technology* scores a technology on five dimensions — relatedness, access, adaptability, biointeraction, appropriateness — across four life-cycle levels: materials, production, use, infrastructure.

    **Takeaways**
    - Convivial biomaterials and engineering biology have clear upsides, but access to instruments has to be safely regulated (dangerous chemicals; risks of self-medication).
    - Convivial technology can also enable misuse (dual use, bioterrorism, self-accreditation; poor cosmetic-surgery practice was cited). **Safety should be added as an extra row in the matrix.**
    - Conviviality might also reduce misuse by making power around technology less asymmetrical: harmful uses can be a product of non-convivial political structures.
    - Accessibility versus complexity: simple technologies are easier to make convivial than complex ones (DNA synthesis, for example). That can change through technology choices, or through shared community instrument facilities.
    - Safer access needs better regulation and the facilities to comply with it, and building such commons is also a political choice. Some controls already exist: screening of DNA orders, FDA-style approval for foods and drugs, university rules for GMO and pathogens.
    - Example: nanoparticle synthesis needs a designated laboratory and proper training; instruments and chemicals can injure the user if mishandled.

- id: biomineral-rocks
  title: "Making rocks: biomineral versus concrete"
  sessions: [RM004]
  note_ids: ["RM004.4"]
  scale: [micro, meso]
  wg: []
  texts:
    - { from: docx, find: "making rocks" }
  refs: []
  notes: |
    - Removing the need for a carbonation step would be a major win — ideally coupling calcium carbonate directly with other elements to mimic Portland cement.
    - Alternatives already exist: supplementary cementitious materials (fly ash, slag, silica fume) partly replace Portland cement, cutting CO₂ and cost while improving durability.
    - Biomineralisation can reduce CO₂ emissions and some companies already pursue it (for example [Biomason](https://biomason.com/) and [BioZeroC](https://www.biozeroc.com/)).
    - Of interest beyond carbonate: control over crystal shape, microstructure, polymorphs and hierarchical structuring; plus added functionality such as self-healing and integration with living systems.

- id: cell-patterning-utility
  title: "Multicellular and cell-lawn patterning: what is it for?"
  sessions: [RM004]
  note_ids: ["RM004.5"]
  scale: [micro, meso]
  wg: []
  texts:
    - { from: docx, find: "cell lawn patterning" }
  refs:
    - { label: "Nature article cited", url: "https://www.nature.com/articles/s41586-026-10259-3" }
    - { label: "Review cited", url: "https://www.sciencedirect.com/science/article/pii/S1369527422000339" }
  notes: |
    **Two axes of use**
    - Change the biomaterials we already have; or use patterning with morphogens to build organoids.
    - Nanostructure can pattern tissue and cells — for example neuron matrices, or nanoparticles that set a pattern or phenotype according to a cell’s metabolic state.

    **Tissue, organoids and appearance**
    - Organoids are mostly a research platform for now (2D to 3D; microfluidics to pattern, for instance, neural tissue).
    - Possible performance targets: colouration, UV protection, antimicrobial or water-repellent surfaces. Could patterning replace photolithography for materials, leaving cell patterning for cell-related purposes?

    **Architecture and wood**
    - For buildings what matters is how a material weathers over time — which biofilms can or cannot grow on it, and whether it ages uniformly.
    - Interesting properties are those that change over time, or are set early and then maintained (pruning a tree is one example).
    - Changing wood’s cellulose/lignin composition, structure or density could matter for construction, but competes with an established industry of post-processing wood (thermally modified “caramelised” wood is fire- and hurricane-resistant).
    - Patterning for cell differentiation and spatiotemporal organisation remains distinct from polymer assembly (for example cellulose); wood is mainly polymer, not only cells.

- id: brain-machine-future
  title: "A transhumanist future? Merging with technology"
  sessions: [RM005]
  note_ids: ["RM005.6"]
  scale: [macro]
  wg: []
  texts:
    - { from: docx, find: "transhumanist future" }
  refs:
    - { label: "Cited in the provocation", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8117115/" }
    - { label: "Nature feature on abandoned implants", url: "https://www.nature.com/immersive/d41586-022-03810-5/index.html" }
  notes: |
    - The discussion started from early clinical-trial results for a brain implant on the motor cortex (for example, controlling a wheelchair by thought).
    - Where might this go? The most influential players seem most interested in enhancement — to keep up with AI (brain–AI interfaces).
    - Which regulations would protect consumers if an implant company goes bankrupt (real cases exist where users and physicians lost access to the proprietary software needed to recalibrate a device) — or protect agency, for example against hacking?
    - Might biomaterials and biological modification turn out to be a more likely route to human enhancement than electronics, or a mixture of both?
    - What are the benefits? Would people be left with no real choice, as has happened with smartphones?

- id: smart-sutures
  title: "Sutures that replace clinical wound assessment?"
  sessions: [RM005]
  note_ids: ["RM005.7"]
  scale: [macro]
  wg: []
  texts:
    - { from: docx, find: "smart enough sutures" }
  refs:
    - { label: "Cited in the provocation (1)", url: "https://www.sciencedirect.com/science/article/pii/S0009250925020469" }
    - { label: "Cited in the provocation (2)", url: "https://www.sciencedirect.com/science/article/pii/S0032386125010997" }
  notes: |
    **Application issues**
    - The chemistry behind the mode of action matters most: a colour-changing dressing is only clinically useful if the signal is specific, reliable and interpretable. pH colour change is easy to engineer.
    - Specificity versus regulation: the more generic the signal, the easier to manufacture but the harder to regulate, with a risk of false positives and false negatives. Condition-dependent monitoring is a problem for generic solutions.

    **At home versus in the clinic**
    - Strong interest in non-invasive diagnostics that limit dressing removal and reapplication. At home: self-detection prompts people to seek care, but misinterpretation, or delayed care if the device fails. In the clinic: bedside diagnostic devices.
    - Key question — clinician redundancy: can the device replace clinical judgement? Self-diagnosis is already common (lateral-flow tests, glucose monitors). The idea of “normal” should be objective and measurable but is often subjective.

    **Is it feasible on a 10–20–30-year horizon?**
    - Animal-derived collagen materials were said to be approved already (citation needed); other candidates include chitosan and cellulose.
    - On-demand synthesis at the point of care; multi- or N-dimensional detection (for example click-chemistry-grafted azido-collagen tuned to several conditions, limited by toxicity and compatibility); hydrogels, where release kinetics matter most; nanozymes; nanodiamonds (not yet demonstrated robustly in vivo).

