# ============================== THEME 2 · Learning nature's design principles ==============================
- id: design-principles
  theme: 2
  match: "Hierarchy, modularity, redundancy"
  label: "Portable design principles"
  scale: [meso, macro]
  wg: [wg1]
  pillar: [design]
  value: [humility, solidarity]
  tags: [tension/copy-vs-principles, concept/hierarchy, concept/self-assembly, concept/dynamic-function, tension/general-vs-specific, barrier/shared-language, concept/ecosystems]
  sources: [biomimicry-too-literal]
  reading: [biomimicry-architecture]
  links:
    - { to: shared-language, type: enables, why: "Principles only transfer if they are written down in a portable form: 'abstract enough to transfer, precise enough to design with'." }
    - { to: printing-meets-growth, type: tension, why: "Self-assembly supplies hierarchy and emergence; machines supply control. Extracting a principle rather than copying a structure points towards designing initial conditions and constraints instead of final form." }
    - { to: unexplored-features, type: extends, why: "Mapping which features have and have not been reproduced is the empirical side of working out which principles are really portable." }

