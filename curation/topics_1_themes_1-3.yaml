# Topics = the discussion prompts under each theme in the Bristol Retreat sheet (Prompts (LIVE)).
# 'match' finds the bullet inside that theme (substring); the sheet's wording is shown verbatim on the site.
# Lenses:  scale (sheet categories), wg (sheet; dashed in UI if only proposed), pillar + value (assigned by the map).
# tags: semantic tags  facet/id  (see tags.yaml).  sources: discussion ids.  reading: Bookshelf book ids (suggestions).
# links: curated bridges to other topics. type = echoes | tension | enables | extends. 'why' is the one-line synthesis.

# ============================== THEME 1 · Defining biomaterials and living materials ==============================
- id: living-vs-formerly-living
  theme: 1
  match: "Living versus formerly living"
  label: "Living vs formerly living"
  scale: [macro]
  wg: [wg1]
  pillar: [design]
  value: [humility]
  tags: [tension/living-vs-inert, domain/living-materials, domain/textiles-and-fashion, domain/cellulose-and-wood, barrier/shared-language, concept/dynamic-function, concept/care-and-maintenance]
  sources: [living-material-wear, everyday-biomaterial]
  reading: [vibrant-matter]
  links:
    - { to: when-to-let-die, type: echoes, why: "Whether a material counts as living has practical consequences: a living material needs ongoing moisture, nutrients and care, and someone has to decide when to stop providing them." }
    - { to: biobased-vs-biomaterial, type: extends, why: "'Living' is one more contested word alongside 'bio': the same discipline-by-discipline drift in meaning applies to it." }

- id: biobased-vs-biomaterial
  theme: 1
  match: "Should we differentiate biobased materials"
  label: "Biobased vs biomaterial"
  scale: [macro]
  wg: [wg1]
  pillar: [governance, design]
  value: [humility]
  tags: [barrier/shared-language, tension/natural-vs-good, domain/medical-and-clinical, domain/textiles-and-fashion, barrier/regulation-and-evidence]
  sources: [bio-not-good, classing-by-application]
  reading: []
  links:
    - { to: bio-is-not-good, type: echoes, why: "Two faces of one ambiguity: 'bio' tells you about origin, or contact with tissue, not about performance, safety or sustainability. The group's own essay on the Bookshelf makes the same point." }
    - { to: shared-language, type: enables, why: "Being explicit about which meaning of 'biomaterial' is in play, function (use in the body), interaction (with living systems) or origin (biological provenance), is the first move towards a shared language." }

