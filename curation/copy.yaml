about:
  summary: "Why three levels?"
  body: |
    The levels borrow Frank Geels' multi-level perspective, which sorts change into a landscape, a regime and niches.
    Here it is a way to sort the group's discussions at one point in time, a snapshot rather than a timeline.
  refs:
    - text: "Geels (2002), Technological transitions as evolutionary reconfiguration processes: a multi-level perspective and a case-study. Research Policy 31(8–9), 1257–1274"
      url: "https://doi.org/10.1016/S0048-7333(02)00062-8"
    - text: "Geels (2026), The multi-level perspective on sustainability transitions. In Wesche and Hendriks (eds), Introduction to Sustainability Transitions Research. Cambridge University Press, 15–33"
      url: "https://doi.org/10.1017/9781009437318.004"

