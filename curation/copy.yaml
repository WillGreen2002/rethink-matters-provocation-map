  freeze:
    title: "Freeze the text?"
    body: "Editing stops for everyone. The frozen text is what goes to the public map when it is next published, after the map's checks. Anyone with the edit link can unfreeze it again."
    ok: "Freeze"
  unfreeze:
    title: "Unfreeze the text?"
    body: "Editing opens again for everyone with the edit link."
    ok: "Unfreeze"
  welcome:
    title: "Editing the map"
    lede: "You have the map's edit link. Press Edit (top right) to switch edit mode on: everything you can change is then outlined. Your changes are shared with everyone who has the link at once; the public map changes only when it is published."
    items:
      - "**Click into any outlined text** (a theme's title, question or future, the overall answer, a prompt, a discussion and what the group said, the explainers, the conflicts statement) and type. **Click away** (or press Enter) to save; Esc puts it back as it was."
      - "**Nothing is lost.** **History** under a changed text shows every earlier version, with initials and time, and can bring one back."
      - "**After a provocation**, open its prompt and choose **Add to this prompt**: a note from the discussion, a paper, a company, a book or a link. It appears on the prompt's Niche straight away. A second person ticks **I have checked this** before it can go public."
      - "**Freeze** stops editing for everyone when the text is ready to publish. Anyone with the link can unfreeze."
      - "Other people's changes appear by themselves every half minute, or press ⟳. **Done editing** turns the outlines off."
    ok: "Start editing"
  setup:
    title: "Set up editing for the map"
    lede: "Do this once (about five minutes). Changes made in edit mode go through a Google Form you own into its Sheet; this page then gives you the edit link to send. Nothing here is published, and the Form's address never appears on the public site."
    steps:
      - "Use a **personal Google account** (a university account usually only lets university users answer)."
      - "Go to **forms.new**. Name it *Rethink Matters map: changes*. Add five questions, all **Short answer** except the second, which is **Paragraph**, titled exactly: **key**, **text**, **action**, **who**, **extra**. None of them required."
      - "In **Settings**, then **Responses**: set *Collect email addresses* to **Do not collect**, and turn **off** *Limit to 1 response* and any *Restrict to users in…* option."
      - "Press **Publish** (if shown). Then open the **⋮** menu, choose **Get pre-filled link**, type **KEY**, **TEXT**, **ACTION**, **WHO** and **EXTRA** into the five boxes in that order, press **Get link**, then **Copy link** (leave *Shorten URL* off). Paste it below."
      - "In the Form's **Responses** tab choose **Link to Sheets**, then **Create a new spreadsheet**, and open it. Press **Share**, set *General access* to **Anyone with the link**, **Viewer**, then **Copy link**. Paste it below."
      - "Press **Check and make the link**: this page sends one test row through the Form and reads it back from the Sheet."
    form: "The Form's pre-filled link"
    form_ph: "the Form link with KEY, TEXT, ACTION, WHO, EXTRA in it"
    sheet: "The Sheet's link"
    sheet_ph: "the Sheet's share link"
