center:
  kind: "The question"
  crumb: "Rethink Matters · provocation map"
  answer: "Our answer"
  howto: "How to read this map"
  howto_items:
    - "**Three levels, from the big picture down.** The Landscape shows the nine themes. Double-click a theme to see its prompts; double-click a prompt and the Niche shows what sits under it (or use Go down in a note). One click opens a note. Up (or Esc) goes back a level, and the level bar says where you are."
    - "**On the Landscape**, a theme's note holds a future we would want, unless the group has still to write it. On a wide screen, dashed lines join themes whose prompts are linked."
    - "**On Prompts**, point at a prompt and its links light up: teal echoes, terracotta pulls in tension, olive enables, ochre leads on; dashed lines share keywords or a discussion. A dashed disc is an open question, not discussed yet. The other themes it reaches sit further out: choose one to move across."
    - "**On the Niche**, a prompt's discussions, books and examples sit round it, and the prompts it links to further out. Open a discussion for the provocation and what the group said."
    - "**Colour** shows the theme: a theme and its prompts share one colour."
    - "**A guided walk** is the quickest way in: a handful of prompts, in order, moving across themes and ending on what they add up to."
