# Every piece of wording the map shows, in one place, so Rethink Matters can edit it without touching code.
# The site reads these by key (e.g. levels.regime.name). Words in {curly brackets} are filled in by the site: keep them.
# House style: plain words, one idea per sentence, UK spelling, sentence case, and no em dashes.
# Glossary (one word, one meaning): theme = one of the nine; prompt = a question or topic under a theme (mostly the sheet's prompts);
# provocation = what a provocateur put to a session; discussion = a session's provocation and what was said (its notes);
# source = what sits under a prompt on the Niche (its discussions, examples and books); note = the panel that opens when you
# choose something; chapter = one of the Bookshelf's three shelves; example = a real case on the Niche; walk = a guided walk.
