    bad_link: "A link must start with https:// (and be public)."
    save: "Add"
    done: "Added"
  bar:
    region: "Review copy"
    tag: "Review copy"
    count: "{n} changes"
    count_one: "1 change"
    refresh: "Fetch the latest changes"
    help: "How it works"
    freeze: "Freeze"
    frozen: "Frozen {date}"
  status:
    loading: "connecting…"
    synced: "up to date {time}"
    offline: "cannot reach the Sheet: showing the last text"
    send_failed: "a change could not be sent: check the connection and try again"
    saving: "saving…"
    saving_n: "{n} saving"
    new: "{n} new changes from the committee"
    new_one: "1 new change from the committee"
    demo: "trial: changes stay in this browser"
  freeze:
    title: "Freeze the text?"
    body: "Editing stops for everyone. The frozen text is what goes to the public map, once it has been through the map's checks. Anyone on the committee can unfreeze it again."
    ok: "Freeze"
  unfreeze:
    title: "Unfreeze the text?"
    body: "Editing opens again for everyone."
    ok: "Unfreeze"
  welcome:
    title: "The committee's review copy"
    lede: "This is a private working copy of the provocation map for the Rethink Matters committee. Changes here do not reach the public map until the committee freezes the text."
    items:
      - "**Edit text in place.** Open any theme, prompt or discussion: each main block of text (a theme's question and its future, the overall answer, a prompt, what the group said) has an **Edit** button. **Save** shares it with everyone at once."
      - "**Nothing is lost.** **History** under a block shows every earlier version, with initials and time, and can bring one back."
      - "**After a provocation**, open its prompt and choose **Add to this prompt**: a note from the discussion, a paper, a company, a book or a link. It appears on the prompt's Niche straight away. A second person ticks **I have checked this** before it can go public."
      - "**Freeze** (top right) stops editing for everyone when the committee is happy. The frozen text then goes to the public map. Anyone can unfreeze."
      - "Other people's changes appear by themselves every half minute, or press ⟳."
    ok: "Start reviewing"
  setup:
    title: "Set up the committee's review copy"
    lede: "Do this once (about five minutes). The committee's changes go through a Google Form you own into its Sheet; this page then gives you the link to send them. Nothing here is published, and the Form's address never appears on the public site."
    member: "On the committee? Open the review link you were sent: it sets this browser up. After that, this page opens the review copy directly."
    steps:
      - "Use a **personal Google account** (a university account usually only lets university users answer)."
      - "Go to **forms.new**. Name it *Rethink Matters map: changes*. Add five questions, all **Short answer** except the second, which is **Paragraph**, titled exactly: **key**, **text**, **action**, **who**, **extra**. None of them required."
      - "In **Settings**, then **Responses**: set *Collect email addresses* to **Do not collect**, and turn **off** *Limit to 1 response* and any *Restrict to users in…* option."
      - "Press **Publish** (if shown). Then open the **⋮** menu, choose **Get pre-filled link**, type **KEY**, **TEXT**, **ACTION**, **WHO** and **EXTRA** into the five boxes in that order, press **Get link**, then **Copy link** (leave *Shorten URL* off). Paste it below."
      - "In the Form's **Responses** tab choose **Link to Sheets**, then **Create a new spreadsheet**, and open it. Press **Share**, set *General access* to **Anyone with the link**, **Viewer**, then **Copy link**. Paste it below."
      - "Press **Check and make the link**: this page sends one test row through the Form and reads it back from the Sheet."
    form: "The Form's pre-filled link"
    form_ph: "the Form link with KEY, TEXT, ACTION, WHO, EXTRA in it"
    sheet: "The Sheet's link"
    sheet_ph: "the Sheet's share link"
    go: "Check and make the link"
    demo: "Try it first (changes stay in this browser)"
    testing: "Sending a test row through the Form and reading it back from the Sheet (up to half a minute)…"
    bad_form: "That is not a Google Form pre-filled link (it should contain /viewform and entry. numbers)."
    short_link: "That is a shortened link: get the pre-filled link again with Shorten URL turned off."
    missing: "The pre-filled link is missing {fields}: type those words into the matching boxes and get the link again."
    bad_sheet: "That is not a Google Sheets link."
    no_row: "The test row did not reach the Sheet. Check that the Form accepts responses without signing in, and that the Sheet is the one linked to this Form."
    no_sheet: "The Sheet could not be read. Check that its General access is Anyone with the link, Viewer."
    ok: "It works: the Form writes and the Sheet reads. Send the committee this link (it carries the Form and Sheet addresses, so keep it within the committee):"
    link: "The committee's review link"
    copy: "Copy the link"
    copied: "Link copied"
    open: "Open the review copy"
    send: "Each person opens it once; their browser then remembers it. You can also keep the Sheet itself as a record: every change is a row."
