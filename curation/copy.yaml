center:
  kind: "The question"
  crumb: "Rethink Matters · provocation map"
  answer: "Our draft answer"
  howto: "How to read this map"
  howto_items:
    - "**Three levels, from the big picture down.** The Landscape shows the nine themes. Step into a theme and the Regime shows its prompts; step into a prompt and the Niche shows what sits under it. The level bar says where you are."
    - "**On the Landscape**, each theme has a draft future and an arrow down to its prompts. On a wide screen, dashed lines join themes whose prompts are linked; the thicker the line, the more links."
    - "**On the Regime**, point at a prompt and its links light up: teal echoes, terracotta pulls in tension, olive enables, ochre leads on; dashed lines share tags or a discussion. The other themes it reaches sit further out: choose one to move across."
    - "**On the Niche**, a prompt's discussions, books and examples sit round it, and the prompts it links to further out. Open a discussion for the provocation and what the group said."
    - "**Colour** shows each prompt's pillar of the Rethink Matters mission; the key in the Explore tab names them."
    - "**A guided walk** is the quickest way in: a handful of prompts, in order, moving across themes and ending back at the question."
