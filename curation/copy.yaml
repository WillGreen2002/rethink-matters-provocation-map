    - "**On the Landscape**, dashed lines join themes whose prompts are linked; the thicker the line, the more links. Each theme has a draft future and an arrow down to its provocations."
    - "**On the Regime**, point at a prompt and its links light up: teal echoes, terracotta pulls in tension, olive enables, ochre leads on. Dashed lines share tags or a discussion."
    - "**Click a prompt** for the provocation behind it, what the group said, and why it connects to the others."
    - "**Colour** shows each prompt's pillar of the Rethink Matters mission, or its theme. Show only one chapter, theme or pillar from the Explore tab."
