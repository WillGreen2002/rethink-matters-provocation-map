name: Publish site to GitHub Pages

# Publishes ONLY the site/ folder (index.html, graph-data.js, assets/). The notes vault, curation files and build tools stay in the repo
# but are not served. To update the live site: rebuild locally (python -I build/build.py), run build/preflight.py, commit and push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
